name: Update TeamIntel Dashboard

on:
  schedule:
    # Hourly, but pause overnight to cut Vercel redeploys / Actions runs.
    # GitHub cron is UTC-only. During the draft season the East Coast is on
    # EDT (UTC-4), so the 12am-6am ET quiet window == 04:00-09:59 UTC.
    # Runs at UTC 00-03 and 10-23 (resuming at 6am ET = 10:00 UTC).
    # NOTE: not DST-aware — in EST/winter this window shifts an hour, but the
    # dashboard's active window ends at the July 2026 draft (all EDT).
    - cron: '0 0-3,10-23 * * *'
  workflow_dispatch: # Allow manual trigger (always runs, ignores the window)

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install slack-sdk redis

      - name: Fetch and build dashboard
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OUTPUT_DIR: ./public
        run: |
          mkdir -p public
          python fetch_and_build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/teamintel.json
          git diff --staged --quiet || git commit -m "Auto-update TeamIntel dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
