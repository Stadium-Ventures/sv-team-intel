name: Update TeamIntel Dashboard

on:
  schedule:
    # Fires every 15 min. A "cadence gate" step (below) decides whether each
    # firing actually builds:
    #   * Pre-draft push (until DRAFT_PUSH_END): build every firing, 24/7 —
    #     fastest turnaround for last-minute intel.
    #   * After the push: auto-reverts to the original cadence — hourly (top of
    #     the hour) during UTC 00-03 and 10-23 (skips the 04:00-09:59 UTC quiet
    #     window == 12am-6am ET). No manual change needed.
    # GitHub's scheduler can add a few minutes of jitter/delay under load.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual trigger — always builds, bypasses the gate

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Cadence gate
        id: gate
        run: |
          # Pre-draft fast window end (UTC). Fast mode = build every 15 min, 24/7
          # until this instant; after it, revert to hourly-daytime. Bump to extend.
          PUSH_END=$(date -u -d '2026-07-14 00:00:00' +%s)
          NOW=$(date -u +%s)
          HOUR=$((10#$(date -u +%H)))
          MIN=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — always build."; echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$NOW" -lt "$PUSH_END" ]; then
            echo "Pre-draft push: build (every ~15 min, 24/7)."; echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$MIN" -lt 15 ] && { [ "$HOUR" -le 3 ] || [ "$HOUR" -ge 10 ]; }; then
            echo "Post-draft: hourly daytime build."; echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Post-draft: skip (off-hour or overnight quiet window)."; echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install slack-sdk redis

      - name: Fetch and build dashboard
        if: steps.gate.outputs.proceed == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OUTPUT_DIR: ./public
        run: |
          mkdir -p public
          python fetch_and_build.py

      - name: Commit and push
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/teamintel.json
          # Skip the commit (and the Vercel redeploy it triggers) when the only
          # change is the "Last updated" timestamp stamped into index.html every
          # build — i.e. no new/edited data this run. `-I` ignores hunks whose
          # changed lines all match the regex; teamintel.json carries no volatile
          # field, so any real data change still trips the guard and commits.
          if git diff --staged --quiet -I'Last updated:'; then
            echo "No data change (only the timestamp moved) — skipping commit & redeploy."
            exit 0
          fi
          git commit -m "Auto-update TeamIntel dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push with retry. A transient GitHub "fatal error in commit_refs" or a
          # concurrent push (manual run coinciding with cron) can reject the first
          # attempt. Rebase onto the latest main between tries. If another run
          # already pushed newer data (rebase conflict on the regenerated files),
          # bail cleanly — the next scheduled run regenerates from source anyway.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; syncing with origin/main..."
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "origin/main already has newer data — skipping; next run refreshes."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Push failed after 3 attempts (likely a transient GitHub issue)."
          exit 1
